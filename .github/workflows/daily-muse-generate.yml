name: Daily Muse — 콘텐츠 생성

on:
  schedule:
    # 매일 오전 6시 (KST = UTC+9, 즉 UTC 21:00 전날)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "생성할 카테고리 (쉼표 구분, 비워두면 전체)"
        required: false
      keywords:
        description: "개인화 키워드 (쉼표 구분)"
        required: false
      dry_run:
        description: "저장 없이 미리보기만 (true/false)"
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: daily-muse/package-lock.json

      - name: Install dependencies
        working-directory: daily-muse
        run: npm ci

      - name: Generate content
        working-directory: daily-muse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.categories }}" ]; then
            ARGS="$ARGS --categories=${{ github.event.inputs.categories }}"
          fi
          if [ -n "${{ github.event.inputs.keywords }}" ]; then
            ARGS="$ARGS --keywords=${{ github.event.inputs.keywords }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          node scripts/generate.js $ARGS

      - name: Commit & push updated feed
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-muse/data/feed.json daily-muse/data/archive/
          git diff --cached --quiet && echo "변경 없음" || \
            git commit -m "chore: daily muse 콘텐츠 갱신 $(date -u +'%Y-%m-%d')" && \
            git push
