<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="11" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="10.5" stroke="#27272B"/>
  <!-- 'ID' wordmark, monospace style -->
  <g fill="#F4F4F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="32" y="40" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2">ID</text>
  </g>
  <!-- pulse dot (signal) -->
  <circle cx="50" cy="14" r="3" fill="#A78BFA"/>
  <circle cx="50" cy="14" r="5" fill="none" stroke="#A78BFA" stroke-opacity="0.5"/>
  <!-- bottom tick: red bull bar -->
  <rect x="14" y="48" width="14" height="3" fill="#F0473E"/>
  <rect x="32" y="48" width="6" height="3" fill="#3E8BF0"/>
  <rect x="42" y="48" width="10" height="3" fill="#27272B"/>
</svg>
